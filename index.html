<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impossible Blade | BIO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="splash-screen" id="splash">
        <h2>▶ НАЖМИТЕ ДЛЯ СТАРТА</h2>
    </div>

    <div class="main-container" id="main">
        <div class="profile-card">
            <img src="assets/photo.jpg" alt="Аватар" class="profile-avatar">
            <div class="profile-name">IMPOSSIBLE<br>BLADE</div>
            <div class="profile-desc">Технологии и боевые искусства</div>
        </div>

        <div class="player-card">
            <div class="player-controls">
                <button class="player-btn" id="play-btn">
                    <img src="assets/play.jpg" alt="Play" id="play-icon">
                </button>
                <div class="progress-container">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>
        </div>

        <div class="social-card">
            <a href="https://t.me/impossible_blade" class="social-link">
                <img src="assets/tg.jpg" alt="Telegram" class="social-icon">
                <span>Telegram</span>
            </a>
            <a href="https://www.tiktok.com/@ufceventsfree" class="social-link">
                <img src="assets/tiktok.jpg" alt="TikTok" class="social-icon">
                <span>TikTok</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
