<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO | Impossible Blade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран входа -->
    <div class="splash-screen" id="splash">
        <h2 class="splash-text">▶ НАЖМИ ДЛЯ СТАРТА</h2>
    </div>

    <!-- Основной контент -->
    <div class="profile" id="profile">
        <div class="content">
            <img src="assets/avatar.jpg" alt="Аватар" class="avatar">
            <h1>IMPOSSIBLE BLADE</h1>
            <p>Создаю контент о технологиях и боевых искусствах</p>
            
            <!-- Кастомный плеер -->
            <div class="player-container">
                <audio id="audio-player" loop>
                    <source src="assets/music.mp3" type="audio/mpeg">
                </audio>
                <div class="player-controls">
                    <button class="play-btn">▶</button>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>

            <!-- Соцсети -->
            <div class="social-grid">
                <a href="https://t.me/impossible_blade" class="social-btn tg" target="_blank">
                    <img src="assets/telegram-icon.svg" alt="Telegram">
                </a>
                <a href="https://www.tiktok.com/@ufceventsfree" class="social-btn tiktok" target="_blank">
                    <img src="assets/tiktok-icon.svg" alt="TikTok">
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
